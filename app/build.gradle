plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

/*
 * Optional release signing.
 *
 * Copy keystore.properties.example to keystore.properties, create a keystore and
 * fill in the values. If the file is absent, `assembleRelease` produces an
 * unsigned APK; debug builds still work normally.
 */
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

android {
    namespace 'com.wowcam.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wowcam.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        // No ABI splits / native code: the whole pipeline is Java/Kotlin + hardware codecs.
        resourceConfigurations += ['en']
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // The applicationId stays exactly com.wowcam.app in every build type so the
            // package is isolated and identical across debug/release installs.
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // The app is intentionally portrait-only: the recorded canvas is a fixed 9:16 frame.
        disable 'LockedOrientationActivity'
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*'
            ]
        }
    }

    dependenciesInfo {
        // Do not add the Play dependency metadata block to APKs/AABs.
        includeInApk false
        includeInBundle false
    }
}

dependencies {
    // CameraX 1.3.1: stable FHD video, target frame-rate control, CameraEffect and PreviewView.
    // (Pinned per the requested production stack; 1.3.1 still exposes the SurfaceProcessor
    // two-target effect API used by the cinematic color pipeline.)
    def cameraxVersion = '1.3.1'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-video:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"

    // Versions compatible with compileSdk 34 (no 35-only transitive AAR metadata).
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Dispatchers.IO for the long-running mux/finalize pipeline.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
