<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>wow cam — UI mirror</title>
<style>
  :root {
    --status: 24px;        /* simulated status bar */
    --nav: 24px;           /* simulated gesture bar */
    --red: #ff3b30;
    --white: #ffffff;
    --secondary: #d7d7db;
    --tertiary: #9a9aa2;
    --stroke: rgba(255,255,255,.22);
    --chip: rgba(18,18,20,.55);
    --chip-active: rgba(255,255,255,.92);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #08080a;
    color: var(--white);
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  #app {
    position: relative;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #000;
  }

  /* ---- edge-to-edge viewfinder ------------------------------------------------ */
  .preview {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(120% 80% at 70% 18%, #4a3a2c 0%, #241d18 45%, #0b0a09 100%);
  }
  .preview::before {           /* window / key light */
    content: "";
    position: absolute;
    left: 62%; top: 12%;
    width: 34%; height: 34%;
    border-radius: 10%;
    background: radial-gradient(circle at 40% 35%, rgba(255,214,160,.55), rgba(255,170,90,.08) 60%, transparent 72%);
    filter: blur(2px);
  }
  .subject {
    position: absolute;
    left: 50%; bottom: -6%;
    width: 58%; height: 62%;
    transform: translateX(-50%) scale(1);
    transform-origin: 50% 63%;
    transition: transform .18s linear, filter .25s linear;
  }
  .subject::before {           /* head */
    content: "";
    position: absolute;
    left: 50%; top: 0;
    width: 42%; aspect-ratio: 1;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #7d5a44, #3a2a21 68%, #221811 100%);
  }
  .subject::after {            /* shoulders */
    content: "";
    position: absolute;
    left: 50%; bottom: 0;
    width: 100%; height: 68%;
    transform: translateX(-50%);
    border-radius: 46% 46% 0 0 / 38% 38% 0 0;
    background: linear-gradient(180deg, #2c2f36, #15171b 70%);
  }
  .grain {
    position: absolute; inset: 0;
    opacity: .10;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }

  /* -- cinematic looks, applied to preview only (recording mirrors preview) ----- */
  .look-vivid .preview { filter: saturate(1.45) contrast(1.08); }
  .look-mono  .preview { filter: grayscale(1) contrast(1.12); }
  .look-warm  .preview { filter: sepia(.38) saturate(1.2) hue-rotate(-8deg); }

  .scrim { position: absolute; left: 0; right: 0; pointer-events: none; }
  .scrim.top {
    top: 0; height: 150px;
    background: linear-gradient(180deg, rgba(0,0,0,.78), rgba(0,0,0,.35) 55%, transparent);
  }
  .scrim.bottom {
    bottom: 0; height: 52%;
    background: linear-gradient(0deg, rgba(0,0,0,.88), rgba(0,0,0,.55) 55%, transparent);
  }

  /* ---- top hardware row ------------------------------------------------------- */
  .top-row {
    position: absolute;
    top: calc(var(--status) + 12px);
    left: 16px;
    right: 16px;
    height: 38px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 4;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    opacity: .35;
    flex: none;
    transition: opacity .2s;
  }
  body.recording .dot { opacity: 1; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .banner {
    flex: 1 1 auto;
    min-width: 0;
    margin-left: 2px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .08em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 8px rgba(0,0,0,.62);
  }

  .icon-btn, .chip {
    appearance: none;
    border: 1px solid var(--stroke);
    background: var(--chip);
    color: var(--white);
    font: inherit;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .icon-btn {
    width: 38px; height: 38px;
    flex: none;
    border-radius: 12px;
    display: grid;
    place-items: center;
    padding: 0;
  }
  .icon-btn svg { width: 22px; height: 22px; display: block; }
  .icon-btn[aria-pressed="true"] {
    background: var(--chip-active);
    color: #111;
  }
  .icon-btn[aria-pressed="true"] svg { stroke: #111; }
  .icon-btn:disabled { opacity: .45; cursor: default; }
  .chip:focus-visible, .icon-btn:focus-visible, .record:focus-visible, input:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 2px;
  }

  .fps {
    height: 32px;
    min-width: 54px;
    padding: 0 10px;
    flex: none;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .02em;
  }

  .quality {
    position: absolute;
    top: calc(var(--status) + 12px + 38px + 3px);
    left: 34px;
    font-size: 10px;
    letter-spacing: .14em;
    color: var(--secondary);
    text-shadow: 0 2px 6px rgba(0,0,0,.62);
    z-index: 4;
  }

  /* ---- bottom control stack: grows upward from nav inset ---------------------- */
  .bottom {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0 16px calc(12px + var(--nav));
    display: flex;
    flex-direction: column;
    align-items: stretch;
    z-index: 4;
  }

  .chips {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .chips .chip {
    flex: 1 1 0;
    min-width: 0;
    height: 38px;
    border-radius: 12px;
    padding: 0 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background .18s, color .18s;
  }
  .chips .chip.active {
    background: var(--chip-active);
    color: #101012;
    border-color: transparent;
  }

  .zoom-row {
    display: flex;
    align-items: center;
    gap: 0;
    height: 34px;
    margin-bottom: 5px;
  }
  .zoom-caption {
    flex: none;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--tertiary);
  }
  #zoom {
    flex: 1 1 auto;
    min-width: 0;
    height: 34px;
    margin: 0 8px;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  #zoom::-webkit-slider-runnable-track {
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,.9) var(--fill,0%), rgba(255,255,255,.22) var(--fill,0%));
  }
  #zoom::-webkit-slider-thumb {
    appearance: none;
    width: 14px; height: 14px;
    margin-top: -6px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 1px 6px rgba(0,0,0,.5);
  }
  #zoom:disabled { opacity: .45; cursor: default; }
  .zoom-value {
    flex: none;
    width: 42px;
    text-align: right;
    font: 700 13px/1 ui-monospace, "Cascadia Mono", monospace;
    font-variant-numeric: tabular-nums;
  }

  .elapsed {
    margin: 0 auto 1px;
    font: 700 28px/1.1 ui-monospace, "Cascadia Mono", monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: .08em;
    color: var(--secondary);
    text-shadow: 0 2px 8px rgba(0,0,0,.62);
    transition: color .2s;
  }
  body.recording .elapsed { color: var(--white); }

  .status {
    margin: 0 auto 6px;
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--tertiary);
    text-shadow: 0 2px 6px rgba(0,0,0,.62);
    white-space: nowrap;
  }

  /* 30% of the screen width, 1:1, like layout_constraintWidth_percent="0.30" */
  .record {
    align-self: center;
    width: 30vw;
    aspect-ratio: 1;
    margin: 0 0 4px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
    position: relative;
  }
  .ring {
    position: absolute;
    width: 86px; height: 86px;
    max-width: 100%; max-height: 100%;
    border: 3px solid rgba(255,255,255,.92);
    border-radius: 50%;
    transition: border-color .2s, transform .2s;
  }
  .core {
    width: 60px; height: 60px;
    max-width: 70%; max-height: 70%;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 2px 18px rgba(255,59,48,.4);
    transition: width .18s, height .18s, border-radius .18s, background .18s;
  }
  body.recording .ring { border-color: rgba(255,59,48,.85); }
  body.recording .core {
    width: 30px; height: 30px;
    border-radius: 7px;
    background: var(--red);
  }

  .hint {
    margin: 0 auto 2px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .18em;
    color: var(--secondary);
    text-shadow: 0 2px 6px rgba(0,0,0,.62);
    white-space: nowrap;
  }
  .audio {
    margin: 0 auto;
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--tertiary);
    text-shadow: 0 2px 6px rgba(0,0,0,.62);
    white-space: nowrap;
  }

  /* ---- countdown ------------------------------------------------------------- */
  .countdown {
    position: absolute;
    inset: 0;
    z-index: 8;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,.55);
    cursor: pointer;
  }
  .countdown[hidden] { display: none; }
  .countdown-inner { text-align: center; }
  #cdNum {
    font-size: 150px;
    font-weight: 900;
    line-height: .95;
    text-shadow: 0 6px 18px rgba(0,0,0,.5);
  }
  .cd-hint {
    margin-top: 18px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .22em;
    color: var(--secondary);
  }

  /* Hide debug helpers from screenshots */
  .no-shot { display: none !important; }
</style>
</head>
<body>
<main id="app" data-testid="app">
  <div class="preview" data-testid="preview" aria-hidden="true">
    <div class="subject" id="subject"></div>
    <div class="grain"></div>
  </div>
  <div class="scrim top" aria-hidden="true"></div>
  <div class="scrim bottom" aria-hidden="true"></div>

  <header class="top-row">
    <span class="dot" aria-hidden="true"></span>
    <span class="banner">wow cam</span>

    <button id="flash" class="icon-btn" type="button" aria-pressed="false"
            aria-label="Turn light on" data-testid="flash">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 2v11h3v9l7-12h-4l4-8z" fill="currentColor" stroke="none"/>
      </svg>
    </button>

    <button id="flip" class="icon-btn" type="button"
            aria-label="Switch camera" data-testid="flip">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M6 9 2 13l4 4v-3h8v-2H6V9zm12 6 4-4-4-4v3h-8v2h8v3z"/>
      </svg>
    </button>

    <button id="fps" class="chip fps" type="button"
            aria-label="Frame rate" data-testid="fps">30 FPS</button>
  </header>

  <div class="quality" data-testid="quality">1080P • 9:16 • 30 MBPS</div>

  <section class="bottom" data-testid="bottom">
    <div class="chips">
      <button id="filter" class="chip" type="button"
              aria-label="Filter" data-testid="filter">FILTER • NORMAL</button>
      <button id="timer" class="chip" type="button"
              aria-label="Timer" data-testid="timer">TIMER • OFF</button>
    </div>

    <div class="zoom-row">
      <span class="zoom-caption">ZOOM</span>
      <input id="zoom" type="range" min="0" max="1000" step="1" value="0"
             aria-label="Zoom level" data-testid="zoom">
      <span id="zoomValue" class="zoom-value" data-testid="zoomValue">1.0x</span>
    </div>

    <div id="elapsed" class="elapsed" data-testid="elapsed">00:00</div>
    <div class="status" data-testid="status">1080P • 9:16 • 30 MBPS</div>

    <button id="record" class="record" type="button"
            aria-label="Record video" data-testid="record">
      <span class="ring" data-testid="recordRing" aria-hidden="true"></span>
      <span class="core" data-testid="recordCore" aria-hidden="true"></span>
    </button>

    <div id="hint" class="hint" data-testid="hint">TAP TO RECORD</div>
    <div id="audio" class="audio" data-testid="audio">VOICE ISO • NS + AEC</div>
  </section>

  <div id="countdown" class="countdown" hidden data-testid="countdown">
    <div class="countdown-inner">
      <div id="cdNum">3</div>
      <div class="cd-hint">TAP TO CANCEL</div>
    </div>
  </div>
</main>

<script>
  "use strict";

  const $ = (id) => document.getElementById(id);
  const app = $("app");
  const flash = $("flash");
  const flip = $("flip");
  const fps = $("fps");
  const filter = $("filter");
  const timer = $("timer");
  const zoom = $("zoom");
  const zoomValue = $("zoomValue");
  const record = $("record");
  const hint = $("hint");
  const elapsed = $("elapsed");
  const countdown = $("countdown");
  const cdNum = $("cdNum");

  const filters = ["NORMAL", "VIVID", "MONO", "WARM"];
  const timers = [0, 3, 10];

  const state = {
    lens: "back",
    torch: false,
    filter: 0,
    timer: 0,
    recording: false,
    countdown: null,
    elapsed: 0,
    elapsedTimer: null,
  };

  /* Android dp ≈ CSS px at these viewports. */

  function render() {
    document.body.classList.toggle("recording", state.recording);
    document.body.classList.toggle("look-vivid", filters[state.filter] === "VIVID");
    document.body.classList.toggle("look-mono", filters[state.filter] === "MONO");
    document.body.classList.toggle("look-warm", filters[state.filter] === "WARM");

    const canFlash = state.lens === "back";
    flash.disabled = !canFlash;
    flash.setAttribute("aria-pressed", String(state.torch));
    flash.setAttribute("aria-label", state.torch ? "Turn light off" : "Turn light on");

    flip.disabled = state.recording;

    filter.textContent = "FILTER • " + filters[state.filter];
    filter.classList.toggle("active", state.filter !== 0);

    timer.textContent = "TIMER • " + (state.timer === 0 ? "OFF" : state.timer + "S");
    timer.classList.toggle("active", state.timer !== 0);

    hint.textContent = state.recording ? "TAP TO STOP" : "TAP TO RECORD";
    record.setAttribute("aria-label", state.recording ? "Stop recording" : "Record video");

    const mm = String(Math.floor(state.elapsed / 60)).padStart(2, "0");
    const ss = String(state.elapsed % 60).padStart(2, "0");
    elapsed.textContent = mm + ":" + ss;
  }

  function updateZoom() {
    const t = Number(zoom.value) / 1000;
    zoomValue.textContent = (1 + t * 4).toFixed(1) + "x";
    zoom.style.setProperty("--fill", (t * 100).toFixed(1) + "%");
    $("subject").style.transform = "translateX(-50%) scale(" + (1 + t * 0.08).toFixed(3) + ")";
  }

  flash.addEventListener("click", () => {
    if (flash.disabled) return;
    state.torch = !state.torch;
    render();
  });

  flip.addEventListener("click", () => {
    if (state.recording) return;
    state.lens = state.lens === "back" ? "front" : "back";
    state.torch = false;
    zoom.value = "0";
    updateZoom();
    render();
  });

  filter.addEventListener("click", () => {
    state.filter = (state.filter + 1) % filters.length;
    render();
  });

  timer.addEventListener("click", () => {
    state.timer = timers[(timers.indexOf(state.timer) + 1) % timers.length];
    render();
  });

  zoom.addEventListener("input", updateZoom);

  function startRecording() {
    state.recording = true;
    state.elapsed = 0;
    clearInterval(state.elapsedTimer);
    state.elapsedTimer = setInterval(() => {
      state.elapsed += 1;
      render();
    }, 1000);
    render();
  }

  function stopRecording() {
    state.recording = false;
    state.elapsed = 0;
    clearInterval(state.elapsedTimer);
    state.elapsedTimer = null;
    render();
  }

  function cancelCountdown() {
    if (state.countdown === null) return;
    clearInterval(state.countdown);
    state.countdown = null;
    countdown.hidden = true;
    hint.textContent = "TAP TO RECORD";
  }

  function beginCountdown() {
    let remaining = state.timer;
    countdown.hidden = false;
    cdNum.textContent = String(remaining);
    hint.textContent = "STARTING IN…";
    state.countdown = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(state.countdown);
        state.countdown = null;
        countdown.hidden = true;
        startRecording();
      } else {
        cdNum.textContent = String(remaining);
      }
    }, 1000);
  }

  record.addEventListener("click", () => {
    if (state.countdown !== null) return;
    if (state.recording) {
      stopRecording();
      return;
    }
    if (state.timer > 0) beginCountdown();
    else startRecording();
  });

  countdown.addEventListener("click", cancelCountdown);

  fps.addEventListener("click", () => {
    fps.textContent = fps.textContent.startsWith("30") ? "60 FPS" : "30 FPS";
    document.querySelector(".quality").textContent =
      "1080P • 9:16 • 30 MBPS";
    document.querySelector(".status").textContent =
      "1080P • 9:16 • 30 MBPS";
  });

  render();
  updateZoom();
</script>
</body>
</html>
